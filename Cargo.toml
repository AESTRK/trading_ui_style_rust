[package]
name = "trading_ui_style_rust"
version = "0.1.0"
edition = "2024"

[features]
default = ["launcher"]
launcher = ["dep:eframe", "dep:winit"]

[dependencies]
egui = "0.31"
tracing = "0.1"
app_runtime_rust = { path = "../app_runtime_rust" }
serde_json = "1"
eframe = { version = "0.31", optional = true, default-features = true }
winit = { version = "0.30", optional = true, default-features = true }
